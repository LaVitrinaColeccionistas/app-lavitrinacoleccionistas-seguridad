server:
  port: 8085
  servlet:
    context-path: /api

spring:
  application:
    name: app-lavitrinacoleccionistas-ms-seguridad
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL:false}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 30m
      issuer: lvc-auth
    registro:
      rol: ${REGISTRO_ROL:COMPRADOR}
      estado: ${REGISTRO_ESTADO:ACTIVO}
  cache:
    tipo: ${CACHE_TIPO:redis}
    prefijo: ${CACHE_PREFIJO:lvc:seguridad:}
    ttl-defecto: ${CACHE_TTL_DEFECTO:10m}
    dominios:
      usuario: ${CACHE_DOMINIO_USUARIO:usuario}
      rol: ${CACHE_DOMINIO_ROL:rol}
    ttl:
      usuario: ${CACHE_TTL_USUARIOS:15m}
      rol: ${CACHE_TTL_ROLES:0}

logging:
  level:
    py.com.applavitrinacoleccionistasmsseguridad.cache: ${LOG_LEVEL_CACHE:DEBUG}
